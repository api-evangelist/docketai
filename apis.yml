aid: docketai
name: Docket
description: >-
  Docket (docket.io, formerly Docket AI on docketai.com) is an Agentic Marketing
  platform for B2B revenue teams. Its AI Marketing Agent engages inbound website
  visitors in real voice or text conversations, answers from approved product
  knowledge, qualifies intent in real time and produces an Agent Qualified Lead (AQL)
  with full conversation context. The governed Sales Knowledge Lake ingests 100+ data
  sources — CRM records, Gong calls, Slack, Google Drive, Notion, SharePoint, Intercom
  and product documentation — and the agent supports 40+ languages. Docket deploys as
  a per-agent JavaScript snippet with no engineering work, and syncs to the go-to-market
  stack through native Salesforce, HubSpot, Marketo, Microsoft Dynamics 365, Demandbase,
  Zoom and Google Calendar connectors. Docket publishes NO public REST API and no
  OpenAPI, but it does ship two real developer surfaces: the Docket Demand MCP server,
  a hosted read-only remote MCP endpoint at demand-mcp.app.docketai.com/mcp secured by
  OAuth 2.0 with dynamic client registration; and the window.AISeller browser
  JavaScript API for passing visitor context into an agent. The company raised a $15M
  Series A and is backed by Mayfield.
