apis:
- name: Docket Demand MCP
  description: >-
    Docket's hosted, read-only remote Model Context Protocol server. It exposes Demand
    Capture Agents and their performance, captured visitors and leads, engaged accounts,
    conversation summaries with qualification status, pain points and next steps, and
    transcripts and recordings where the authorizing user's Docket permissions allow.
    Transport is Streamable HTTP; authorization is OAuth 2.0 (authorization code with
    PKCE S256, device code, refresh tokens, dynamic client registration) against a
    WorkOS AuthKit issuer, and the connection inherits the workspace and permissions of
    the Docket user who authorizes it. The server cannot create, change or delete data.
    The live tools/list call is auth-gated, so tool names and input schemas require
    authenticated introspection.
  humanURL: https://help.docket.io/articles/8225942528-connect-docket-demand-mcp
  baseURL: https://demand-mcp.app.docketai.com/mcp
