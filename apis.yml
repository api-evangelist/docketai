aid: docketai
name: Docket
description: >-
  Docket (formerly Docket AI, docketai.com) is an AI-powered marketing and sales
  agent platform that engages website visitors in real, substantive conversations
  to qualify leads, book meetings, and generate pipeline without a first-touch SDR.
  Its Sales Knowledge Lake ingests 100+ data sources and a custom cognitive /
  retrieval-augmented architecture powers autonomous marketing and website-concierge
  agents that hold voice and text conversations in 40+ languages. Docket deploys via
  a JavaScript snippet ("no developer required") and syncs to the go-to-market stack
  through native connectors for Salesforce, HubSpot, Gong, Slack, Google Drive,
  Notion, SharePoint and more. The company raised a $15M Series A and is backed by
  Mayfield. Docket publishes no public REST API or developer portal; it is an
  agent-and-integration product, so this profile captures its identity, integration
  surface, published llms.txt, and security/compliance posture.
