finding: >-
  Docket publishes NO first-party client library on any public registry, in any
  language. This is consistent with the product: the only integration path is a
  per-agent JavaScript snippet generated inside the Docket application, and the only
  machine-callable API is a hosted remote MCP endpoint that MCP clients speak to
  natively. There is nothing to install. No SDKs pointer is emitted, because emitting
  one would assert a client-library surface that does not exist.

