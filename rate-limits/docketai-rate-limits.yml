note: >-
  Docket publishes no rate limits for either developer surface. The Docket Demand MCP
  endpoint is auth-gated, so no unauthenticated response carrying RateLimit-*,
  X-RateLimit-* or Retry-After headers could be observed — the 401 rejection carried
  none. The AISeller browser API documents no call ceiling on setContext() or the
  widget control methods. An agent integrating with Docket has no runtime backpressure
  signal to read.

commercial_quota_note: >-
  Docket does meter, but commercially rather than per request: plans are sized by
  MONTHLY WEBSITE VISITORS (20,000 / 100,000 / 100,000+) with explicitly unlimited
  conversations and no seat fees. That quota is captured in
  plans/docketai-plans-pricing.yml and is not a rate limit.

