      - path: /.well-known/oauth-protected-resource/mcp   # RFC 9728
        status: 200
        content_type: application/json
        file: docketai-oauth-protected-resource.json
      - path: /.well-known/oauth-authorization-server     # RFC 8414
        status: 200
        content_type: application/json
        file: docketai-oauth-authorization-server.json
