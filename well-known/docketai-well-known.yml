# Five hosts were probed. Only the MCP host serves any well-known document; the
# marketing site (Webflow) answers every /.well-known/* path with an HTML
# "Invalid .well-known request" page, and the application host answers with its
# Next.js 404 shell. Neither is a document.

hosts:
